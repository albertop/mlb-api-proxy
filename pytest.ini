[pytest]
# Pytest configuration for MLB API tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = test

# Markers
markers =
    unit: Unit tests (fast, mocked dependencies)
    integration: Integration tests (test multiple components together)
    contract: Contract tests (validate API spec compliance)
    smoke: Smoke tests (deployment validation, run against live system)
    slow: Slow running tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=api-service
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-branch
    -p no:warnings

# Custom options
[tool:pytest]
addopts = --smoke

# Coverage options
[coverage:run]
source = api-service
omit = 
    */test/*
    */tests/*
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
precision = 2
skip_empty = True
show_missing = True

# Asyncio mode
asyncio_mode = auto

# Log output
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout (for slow tests)
timeout = 300
timeout_method = thread
